AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infraestrutura automatizada com S3 + Lambda (exemplo simples e seguro)

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: dev

Resources:
  # Bucket S3
  MyBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::AccountId}-${Environment}-lambda-example-bucket"

  # Função Lambda
  MyLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Environment}-example-lambda"
      Handler: index.handler
      Runtime: python3.12
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3

          def handler(event, context):
              print("Lambda executada com sucesso!")
              return {
                  'statusCode': 200,
                  'body': json.dumps('Hello from Lambda!')
              }

  # Role usada pela Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-lambda-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

Outputs:
  BucketName:
    Description: Nome do bucket S3 criado
    Value: !Ref MyBucket
  LambdaFunctionName:
    Description: Nome da função Lambda criada
    Value: !Ref MyLambdaFunction


